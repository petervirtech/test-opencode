{% extends "base.html" %}

{% block title %}Add Epic &mdash; PM Buddy{% endblock %}

{% block content %}
<h1>Add Epic</h1>
<form method="post" action="{{ url_for('add_epic') }}">
    <label>Title: <input type="text" name="title" class="form-control"></label>
    <label>Description: <textarea name="description" class="form-control"></textarea></label>
    <button type="submit" class="btn">Create</button>
</form>
<a href="{{ url_for('index') }}">Back to list</a>
{% endblock %}
