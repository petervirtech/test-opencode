{% extends "base.html" %}

{% block title %}Add Feature &mdash; PM Buddy{% endblock %}

{% block content %}
<h1>Add Feature to Epic {{ epic_id }}</h1>
<form method="post" action="{{ url_for('add_feature', epic_id=epic_id) }}">
    <label>Title: <input type="text" name="title" class="form-control"></label>
    <label>Description: <textarea name="description" class="form-control"></textarea></label>
    <button type="submit" class="btn">Add</button>
</form>
<a href="{{ url_for('epic_detail', epic_id=epic_id) }}">Back to Epic</a>
{% endblock %}
