{% extends "base.html" %}

{% block title %}Add Story &mdash; PM Buddy{% endblock %}

{% block content %}
<h1>Add Story to Feature {{ feature_id }}</h1>
<form method="post" action="{{ url_for('add_story', feature_id=feature_id) }}">
    <label>Title: <input type="text" name="title" class="form-control"></label>
    <label>Description: <textarea name="description" class="form-control"></textarea></label>
    <button type="submit" class="btn">Add</button>
</form>
<a href="{{ url_for('feature_detail', feature_id=feature_id) }}">Back to Feature</a>
{% endblock %}
