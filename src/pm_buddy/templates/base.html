<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PM Buddy{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='cbs.css') }}">
    <style>
        @font-face {
            font-family: "Akko W01 Regular";
            font-display: swap;
            src: url("https://cdn.cbs.nl/cdn/fonts/akko-regular.woff2") format("woff2");
        }

        @font-face {
            font-family: "Soho W01 Medium";
            font-display: swap;
            src: url("https://cdn.cbs.nl/cdn/fonts/soho-medium.woff2") format("woff2");
        }
    </style>
</head>
<body>
    <header class="menu-bar">
        <a class="logo" href="{{ url_for('index') }}">
            <img src="{{ url_for('static', filename='cbs-logo.svg') }}" alt="CBS">
        </a>
        <nav class="menu-bar-links" aria-label="Main">
            <a href="{{ url_for('index') }}"{{ (' class="active"' if active == 'epics' else '') | safe }}>Epics</a>
            <a href="{{ url_for('sync') }}"{{ (' class="active"' if active == 'sync' else '') | safe }}>Sync</a>
        </nav>
    </header>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        PM Buddy &mdash; your product management companion
    </footer>
</body>
</html>
